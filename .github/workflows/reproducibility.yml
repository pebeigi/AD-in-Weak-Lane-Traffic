name: Reproducibility checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install the locked environment
        run: python -m pip install --requirement requirements-lock.txt
      - name: Verify and extract the dataset
        run: python -m analysis.verify_data --extract
      - name: Run deterministic model checks
        run: python -m unittest analysis.test_reproducibility
